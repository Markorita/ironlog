<title>IronLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<style>
:root{
  --bg:#0b0d12;--s1:#12151d;--s2:#181c27;--s3:#202534;--line:#232838;--line2:#30364a;
  --tx:#eef0f6;--tx2:#b4b9c8;--mut:#7d8396;
  --train:#d95926;--fuel:#199e70;--rec:#9085e9;--bal:#c98500;
  --kcal:#199e70;--pro:#3987e5;--carb:#c98500;--fat:#d55181;--sug:#9085e9;
  --good:#0ca30c;--warn:#fab219;--bad:#d03b3b;
  --r:18px;--tabh:62px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --num:'Space Grotesk',ui-rounded,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Manrope',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx)}
svg{display:block}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mut{color:var(--mut)}.tx2{color:var(--tx2)}
[hidden]{display:none!important}

/* ---------- shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px;flex-shrink:0}
.brand{font-weight:800;letter-spacing:.2em;font-size:.74rem;color:var(--mut)}
.brand b{color:var(--tx);font-weight:800}
.top-r{display:flex;align-items:center;gap:6px}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(12,163,12,.15)}
.save-dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(208,59,59,.2)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tx2)}
.icon-btn:active{background:var(--s2)}
.icon-btn svg{width:22px;height:22px}
.pages{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:2px 16px calc(var(--tabh) + var(--sb) + 30px);display:none;scrollbar-width:none}
.page::-webkit-scrollbar,.chips::-webkit-scrollbar,.sh-body::-webkit-scrollbar{display:none}
.page.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--sb));padding:0 6px var(--sb);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:rgba(11,13,18,.88);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line);z-index:50}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;font-size:.62rem;font-weight:700;letter-spacing:.02em;color:var(--mut)}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--tx)}
.fab{justify-self:center;width:54px;height:54px;border-radius:18px;background:linear-gradient(140deg,#ff9466,#d95926);display:grid;place-items:center;color:#fff;box-shadow:0 10px 26px rgba(217,89,38,.38),inset 0 1px 0 rgba(255,255,255,.25);transform:translateY(-10px);transition:transform .12s}
.fab:active{transform:translateY(-10px) scale(.92)}
.fab svg{width:26px;height:26px}

/* ---------- type & blocks ---------- */
.h1{font-size:1.6rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.h2{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.eyebrow{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.sub{font-size:.8rem;color:var(--tx2);line-height:1.45}
.small{font-size:.72rem;color:var(--mut)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 14px;gap:8px}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:34px;padding:0 6px;border-radius:9px;font-size:.74rem;font-weight:700;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--s3);color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px 2px}
.chip{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:.78rem;font-weight:700;color:var(--tx2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip.on{background:var(--tx);color:#0b0d12;border-color:var(--tx)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--s2);color:var(--tx2);white-space:nowrap}
.pill.up{color:#5fd35f;background:rgba(12,163,12,.12)}
.pill.dn{color:#ef7a7a;background:rgba(208,59,59,.12)}
.pill.warn{color:var(--warn);background:rgba(250,178,25,.12)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.7rem;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.line{height:0;border-top:2px dashed rgba(238,240,246,.5);width:14px;border-radius:0}
.chart{position:relative;height:180px}
.chart.sm{height:140px}
.chart.lg{height:210px}
.nochart{height:100%;display:grid;place-items:center;font-size:.75rem;color:var(--mut);border:1px dashed var(--line2);border-radius:12px}
.empty{padding:26px 10px;text-align:center;color:var(--mut);font-size:.84rem;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:15px;background:var(--tx);color:#0b0d12;font-weight:800;font-size:.95rem;letter-spacing:.01em}
.btn:active{transform:scale(.985);opacity:.92}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--line2)}
.btn.sm{min-height:38px;width:auto;padding:0 14px;font-size:.78rem;border-radius:11px}
.btn.danger{background:rgba(208,59,59,.14);color:#ef7a7a;border:1px solid rgba(208,59,59,.3)}
.linkbtn{font-size:.76rem;font-weight:800;color:var(--tx2);padding:6px 2px}
.more-btn{display:block;margin:6px auto 0;font-size:.8rem;font-weight:800;color:var(--tx2);padding:12px 20px}

/* ---------- week ---------- */
.wk-nav{display:flex;gap:6px}
.wk-nav button{width:38px;height:38px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx2)}
.wk-nav button:disabled{opacity:.3}
.wk-nav svg{width:18px;height:18px}
.hero{display:grid;grid-template-columns:136px 1fr;gap:16px;align-items:center}
.hero-ring{position:relative;width:136px;height:136px}
.hero-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-ring .hnum{font-size:2.5rem;font-weight:700;line-height:1}
.hero-stats{display:grid;gap:9px}
.hs{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
.hs:last-child{border:0;padding:0}
.hs b{font-size:1.05rem}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.day{background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:76px}
.day.today{border-color:var(--tx2)}
.day.future{opacity:.38}
.day .dl{font-size:.6rem;font-weight:800;color:var(--mut)}
.day .dn{font-size:.9rem;font-weight:700}
.day .dd{display:flex;gap:3px;min-height:6px;flex-wrap:wrap;justify-content:center;padding:0 3px}
.day .dd i{width:6px;height:6px;border-radius:50%}
.day .fb{width:62%;height:4px;border-radius:2px;background:var(--s3);overflow:hidden;margin-top:auto}
.day .fb i{display:block;height:100%;background:var(--kcal);border-radius:2px}
.ins-g{margin-bottom:14px}
.ins-g:last-child{margin-bottom:0}
.ins-t{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.ins-t .ic{width:20px;height:20px;border-radius:7px;display:grid;place-items:center}
.ins-t .ic svg{width:13px;height:13px}
.ins-i{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:.86rem;line-height:1.45;color:var(--tx2)}
.ins-i b{color:var(--tx);font-weight:800}
.ins-i .dot{margin-top:7px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:168px;text-align:left;position:relative;overflow:hidden}
.tile:active{background:var(--s2)}
.tile .tn{display:flex;align-items:center;gap:7px;font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)}
.tile .ts{font-size:2rem;font-weight:700;line-height:1}
.tile .ts small{font-size:.8rem;color:var(--mut);font-weight:600;margin-left:2px}
.tile .tl{font-size:.74rem;line-height:1.4;color:var(--tx2);margin-top:auto}
.tile .bar{position:absolute;left:0;top:0;bottom:0;width:3px}

/* ---------- cards: workouts / meals ---------- */
.wc{display:flex;gap:12px;align-items:stretch;background:var(--s1);border:1px solid var(--line);border-radius:15px;padding:12px 6px 12px 12px;margin-bottom:8px}
.wc-bar{width:4px;border-radius:4px;flex-shrink:0}
.wc-main{flex:1;min-width:0}
.wc-name{font-weight:800;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-sub{font-size:.76rem;color:var(--tx2);margin-top:3px;line-height:1.4}
.wc-note{font-size:.72rem;color:var(--mut);margin-top:3px;font-style:italic}
.wc-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:4px}
.tag{font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:0 6px}
.more{width:36px;height:32px;display:grid;place-items:center;color:var(--mut);border-radius:9px}
.more:active{background:var(--s2)}
.more svg{width:18px;height:18px}
.dgroup{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dgroup .tot{letter-spacing:0;text-transform:none;font-weight:700;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mac{display:inline-flex;gap:3px;align-items:baseline}
.mac i{width:6px;height:6px;border-radius:2px;display:inline-block;transform:translateY(-1px)}
.mlist{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:.74rem;color:var(--tx2)}

/* ---------- bars / progress ---------- */
.mbar{margin-bottom:12px}
.mbar:last-child{margin-bottom:0}
.mbar .mh{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;margin-bottom:6px;gap:8px}
.mbar .mh>span{white-space:nowrap}
.mbar .mh span:first-child{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--tx2)}
.track{height:8px;border-radius:5px;background:var(--s3);position:relative;overflow:visible}
.track>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;max-width:100%}
.track .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx2);border-radius:1px}
.track .band{position:absolute;top:-3px;bottom:-3px;border:1px solid rgba(238,240,246,.4);border-radius:4px}
.stat-row{display:grid;grid-template-columns:repeat(var(--c,4),1fr);gap:8px}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:10px}
.stat .sl{font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:5px}

const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const kfmt=v=>Math.round(v)===0?'0':Math.abs(v)>=10000?(Math.round(v/100)/10).toLocaleString('en-US')+'k':fmt(v);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const p=String(s).slice(0,10).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1);};
const today=()=>ds(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d);};
const wkStart=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d);};
const fd=s=>pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fdw=s=>pd(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fdl=s=>pd(s).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const mkid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const mins=r=>num(r.duration_hours)*60+num(r.duration_minutes);
const fdur=m=>{m=Math.round(m);if(!m)return'';const h=Math.floor(m/60),mm=m%60;return h?(mm?h+'h '+mm+'m':h+'h'):mm+'m';};
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
const mid=r=>(r[0]+r[1])/2;
const vlOf=r=>num(r.reps)*Math.max(num(r.weight),1);
let _tt;
function toast(msg,bad){const t=$('toast');t.textContent=msg;t.className='toast on'+(bad?' bad':'');clearTimeout(_tt);_tt=setTimeout(()=>t.className='toast'+(bad?' bad':''),2600);}

/* =====================================================================
   Storage
   ===================================================================== */
let W=[],NN=[],VER=0,IDX=null,UF=null;
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function setDot(ok){const d=$('save-dot');if(d)d.className='save-dot'+(ok?'':' bad');}
function storageFail(){setDot(false);toast('Storage is full. Download a backup from the menu now.',1);}
function autoBackup(){lsSet(BK,{v:4,d:new Date().toISOString(),data:W,nutrition:NN});}
function saveW(){VER++;if(!lsSet(SK,W)){storageFail();return false;}autoBackup();setDot(true);return true;}
function saveN(){VER++;if(!lsSet(NK,NN)){storageFail();return false;}lsSet(NK+'_bak',NN);autoBackup();setDot(true);return true;}
function normW(w){w=Object.assign({calories:0,duration_hours:0,duration_minutes:0,heart_rate:0},w);if(w.date)w.date=String(w.date).slice(0,10);if(!w.id)w.id=mkid();if(!w.group)w.group='other';return w;}
function normN(n){n=Object.assign({},n);if(n.date)n.date=String(n.date).slice(0,10);if(!n.id)n.id=mkid();if(!Array.isArray(n.foods))n.foods=[];return n;}
function loadAll(){
  let w=lsGet(SK,[]);if(!Array.isArray(w))w=[];
  W=w.filter(x=>x&&x.date).map(normW);
  let n=lsGet(NK,null);
  if(!Array.isArray(n)||!n.length){const b=lsGet(NK+'_bak',[]);n=Array.isArray(n)&&!b.length?n:(Array.isArray(b)?b:[]);}
  NN=n.filter(x=>x&&x.date).map(normN);
  VER++;
}
function regEx(n){n=(n||'').trim();if(!n)return;const l=lsGet(EK,[]);if(!l.includes(n)){l.push(n);l.sort();lsSet(EK,l);}}

/* =====================================================================
   Index (rebuilt only when data changes)
   ===================================================================== */
function idx(){
  if(IDX&&IDX.v===VER)return IDX;
  const wByDate=new Map(),nByDate=new Map(),nDay=new Map(),exMap=new Map(),exGroup=new Map(),exLast=new Map();
  const put=(m,k,v)=>{let a=m.get(k);if(!a){a=[];m.set(k,a);}a.push(v);};
  for(const w of W){put(wByDate,w.date,w);if(w.exercise){put(exMap,w.exercise,w);const l=exLast.get(w.exercise);if(!l||w.date>l.date)exLast.set(w.exercise,w);}}
  for(const [e,l] of exLast)exGroup.set(e,l.group||'other');
  for(const n of NN){put(nByDate,n.date,n);let t=nDay.get(n.date);if(!t){t={cal:0,pro:0,carb:0,fat:0,sug:0,n:0};nDay.set(n.date,t);}t.cal+=num(n.calories);t.pro+=num(n.protein);t.carb+=num(n.carbs);t.fat+=num(n.fat);t.sug+=num(n.sugar);t.n++;}
  IDX={v:VER,wByDate,nByDate,nDay,exMap,exGroup,memo:new Map()};
  return IDX;
}
function memo(key,fn){const I=idx();if(I.memo.has(key))return I.memo.get(key);const v=fn();I.memo.set(key,v);return v;}
function isTraining(d){return (idx().wByDate.get(d)||[]).some(r=>r.group!=='stretching'&&r.group!=='recovery');}
function tgt(d){return TARGETS[isTraining(d)?'training':'rest'];}

/* =====================================================================
   Nutrition scoring
   ===================================================================== */
function tRange(k,T){if(k==='cal')return T.cal;if(k==='carb')return T.carb;if(k==='sug')return[0,T.sug];return[T[k],T[k]];}
function tMid(k,T){return k==='sug'?T.sug:mid(tRange(k,T));}
function hit(k,v,T){if(v==null)return null;
  if(k==='cal')return v>=T.cal[0]*.95&&v<=T.cal[1]*1.08;
  if(k==='carb')return v>=T.carb[0]*.95;
  if(k==='pro')return v>=T.pro*.95;
  if(k==='fat')return v>=T.fat*.8&&v<=T.fat*1.2;
  return v<=T.sug;}
function rangeScore(v,lo,hi,tol){if(v>=lo&&v<=hi)return 1;return v<lo?clamp(1-(lo-v)/(lo*tol)):clamp(1-(v-hi)/(hi*tol));}
function adherence(t,T){
  const c=rangeScore(t.cal,T.cal[0],T.cal[1],.25),p=clamp(t.pro/T.pro),cb=rangeScore(t.carb,T.carb[0],T.carb[1]*1.15,.35);
  const f=clamp(1-(Math.max(0,Math.abs(t.fat-T.fat)-T.fat*.2))/(T.fat*.5)),s=t.sug<=T.sug?1:clamp(1-(t.sug-T.sug)/50);
  return .3*c+.3*p+.2*cb+.1*f+.1*s;
}

/* =====================================================================
   Week engine
   ===================================================================== */
function vlRange(start,n){const I=idx();let v=0;for(let i=0;i<n;i++){for(const r of (I.wByDate.get(addD(start,i))||[]))if(LIFT.includes(r.group))v+=vlOf(r);}return v;}
function weekStats(ws){
  return memo('wk'+ws,()=>{
    const I=idx(),t=today(),days=[...Array(7)].map((_,i)=>addD(ws,i)),we=days[6];
    const current=ws<=t&&t<=we,future=ws>t;
    const elapsed=future?0:(current?days.filter(d=>d<=t).length:7);
    const f=Math.max(elapsed,1)/7;
    const sets={};LIFT.forEach(g=>sets[g]=0);
    let vl=0,reps=0,strengthDays=0,activeDays=0,recMin=0,condMin=0,pickMin=0,liftMin=0,burn=0,anyRows=0;const hrs=[],dayInfo=[];
    let run=0,maxRun=0;
    for(const d of days){
      const rows=I.wByDate.get(d)||[];anyRows+=rows.length;let lift=false,active=false;const fams=new Set();
      for(const r of rows){const g=r.group||'other',m=mins(r);fams.add(FAMILY[g]||'other');
        if(LIFT.includes(g)){if(num(r.reps)>0){sets[g]++;lift=true;}vl+=vlOf(r);reps+=num(r.reps);liftMin+=m;}
        if(g==='stretching'||g==='recovery')recMin+=m;else active=true;
        if(g==='cardio'||g==='pickleball'||g==='other')condMin+=m;
        if(g==='pickleball')pickMin+=m;
        burn+=num(r.calories);if(num(r.heart_rate)>0)hrs.push(num(r.heart_rate));}
      if(lift)strengthDays++;if(active&&d<=t)activeDays++;
      if(d<=t){if(active){run++;maxRun=Math.max(maxRun,run);}else run=0;}
      dayInfo.push({d,rows,fams:[...fams],training:active,future:d>t,nut:I.nDay.get(d)||null});
    }
    const restDays=Math.max(0,elapsed-activeDays);
    // nutrition
    const scored=current?days.filter(d=>d<t):(future?[]:days);
    if(current&&!scored.length)scored.push(t);
    const nut={scored:scored.length,logged:0,adh:[],hits:{cal:0,pro:0,carb:0,fat:0,sug:0},sum:{cal:0,pro:0,carb:0,fat:0,sug:0},calDelta:[],trainCarb:[],trainCarbLo:TARGETS.training.carb[0],trainDays:0};
    for(const d of scored){const tot=I.nDay.get(d);if(!tot)continue;const T=tgt(d);nut.logged++;nut.adh.push(adherence(tot,T));
      MKEYS.forEach(k=>{nut.sum[k]+=tot[k];if(hit(k,tot[k],T))nut.hits[k]++;});nut.calDelta.push(tot.cal-mid(T.cal));
      if(T.key==='training'){nut.trainCarb.push(tot.carb);nut.trainDays++;}}
    nut.avg={};MKEYS.forEach(k=>nut.avg[k]=nut.logged?nut.sum[k]/nut.logged:0);
    // scores
    let prior=0,pc=0;for(let k=1;k<=3;k++){const v=vlRange(addD(ws,-7*k),Math.max(elapsed,1));if(v>0){prior+=v;pc++;}}prior=pc?prior/pc:0;
    let train=null;
    if(!future&&(anyRows||prior)){const cons=clamp(strengthDays/(SESSION_TARGET*f));train=prior>0?.6*cons+.4*clamp((vl/prior-.85)/.2):cons;}
    let fuel=null;if(nut.logged){fuel=avg(nut.adh)*(.7+.3*nut.logged/Math.max(1,nut.scored));}
    let rec=null;if(!future&&(anyRows||nut.logged)){const rs=clamp(restDays/REST_TARGET+(7-elapsed)/7),rm=clamp(recMin/RECOVERY_TARGET+.5*(7-elapsed)/7);rec=(.6*rs+.4*rm)*(maxRun>=6?.8:1);}
    let bal=null;const totalSets=LIFT.reduce((s,g)=>s+sets[g],0);
    const push=sets.chest+sets.shoulders+sets.triceps,pull=sets.back+sets.biceps;
    if(totalSets>0){let s=0,wsum=0;for(const g of LIFT){const ratio=sets[g]/(WEEKLY_SETS[g]*f);const fill=ratio<=1.5?clamp(ratio):clamp(1-(ratio-1.5)*.5);s+=fill*GOAL_W[g];wsum+=GOAL_W[g];}
      bal=s/wsum;if(pull>0&&push>0){const pr=push/pull;if(pr>1.35||pr<.75)bal*=.9;}else if(push+pull>6)bal*=.85;}
    const parts=[train,fuel,rec,bal].filter(v=>v!=null);
    return {ws,we,days,dayInfo,current,future,elapsed,f,sets,vl,reps,prior,strengthDays,activeDays,restDays,recMin,condMin,pickMin,liftMin,burn,hr:hrs.length?Math.round(avg(hrs)):0,maxRun,push,pull,totalSets,nut,
      score:{train,fuel,rec,bal,all:parts.length?avg(parts):null}};
  });
}
const pctS=v=>v==null?'–':Math.round(v*100);
function scoreLabel(v){if(v==null)return'No data yet';v*=100;return v>=80?'Strong week':v>=65?'On track':v>=45?'Mixed week':'Needs work';}

/* ---------- PRs & plateaus ---------- */
function prData(){
  return memo('pr',()=>{const I=idx(),ev=[],best=new Map();
    for(const [ex,rows] of I.exMap){const g=I.exGroup.get(ex);if(!LIFT.includes(g))continue;
      const weighted=rows.some(r=>num(r.weight)>0&&num(r.reps)>0);const byDate=new Map();
      for(const r of rows){const reps=num(r.reps),w=num(r.weight);if(!(reps>0))continue;if(weighted&&!(w>0))continue;
        const v=weighted?w*(1+Math.min(reps,15)/30):reps;const c=byDate.get(r.date);if(!c||v>c.v)byDate.set(r.date,{date:r.date,w,reps,v});}
      const dates=[...byDate.keys()].sort();let b=null;
      for(const d of dates){const c=byDate.get(d);if(b&&c.v>b.v+1e-6)ev.push(Object.assign({ex,g,bw:!weighted},c));if(!b||c.v>b.v)b=c;}
      if(b)best.set(ex,Object.assign({bw:!weighted,sessions:dates.length},b));}
    ev.sort((a,b)=>b.date.localeCompare(a.date));return{ev,best};});
}
function exWeekly(ex){
  return memo('exw'+ex,()=>{const m=new Map();for(const r of (idx().exMap.get(ex)||[])){if(!(num(r.reps)>0))continue;const k=wkStart(r.date);let o=m.get(k);if(!o){o={load:0,sets:0,reps:0,top:0};m.set(k,o);}
    o.load+=vlOf(r);o.sets++;o.reps+=num(r.reps);const w=num(r.weight);const v=w>0?w*(1+Math.min(num(r.reps),15)/30):num(r.reps);if(v>o.top)o.top=v;}return m;});
}
function plateaued(ex){
  return memo('pl'+ex,()=>{const m=exWeekly(ex);const ks=[...m.keys()].sort();if(ks.length<3)return false;const last=ks.slice(-3);
    if(last[2]<addD(wkStart(today()),-21))return false;if(prData().ev.some(e=>e.ex===ex&&e.date>=last[0]))return false;const v=last.map(k=>m.get(k));
    return v[1].load<=v[0].load&&v[2].load<=v[1].load&&v[2].top<=v[0].top+1e-6;});
}
function lastSession(ex,excludeDate){const rows=idx().exMap.get(ex)||[];let d=null;for(const r of rows){if(r.date===excludeDate)continue;if(!d||r.date>d)d=r.date;}
  if(!d)return null;return rows.filter(r=>r.date===d).sort((a,b)=>(a.set_number||1)-(b.set_number||1));}
function topExercises(g,n){const I=idx(),c=[];for(const [ex,rows] of I.exMap)if(I.exGroup.get(ex)===g)c.push([ex,rows.length]);return c.sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0]);}

/* ---------- Insights ---------- */
function insights(S){
  const work=[],miss=[],next=[];const add=(a,p,pri,t)=>a.push({p,pri,t});const cur=S.current;
  const B=s=>'<b>'+s+'</b>';
  if(S.future)return{work,miss,next};
  // Training load & consistency
  if(S.prior>0&&S.vl>0){const ch=(S.vl/S.prior-1)*100;
    if(ch>=5)add(work,'train',8,`Volume load is ${B('+'+Math.round(ch)+'%')} on your 3-week average${cur?' for the same days':''}.`);
    else if(ch<=-12&&S.elapsed>=3){add(miss,'train',6,`Volume load is ${B(Math.round(-ch)+'% below')} your 3-week average.`);add(next,'train',5,`Get back to ${B(SESSION_TARGET+' lifting sessions')} and repeat last week's top sets before adding weight.`);}}
  const need=SESSION_TARGET*S.f;
  if(S.strengthDays>0&&S.strengthDays>=Math.floor(need))add(work,'train',6,`${B(plural(S.strengthDays,'lifting session'))}${cur?' so far, on pace for '+SESSION_TARGET+'+':''}.`);
  else if(S.elapsed>=3&&S.strengthDays<need-.6){add(miss,'train',7,`Only ${B(plural(S.strengthDays,'lifting session'))}${cur?' so far':''}. Your PPL split works best at ${SESSION_TARGET} to 5.`);}
  const prs=prData().ev.filter(e=>e.date>=S.ws&&e.date<=S.we);
  if(prs.length)add(work,'train',9,`New PR${prs.length>1?'s':''}: `+prs.slice(0,3).map(e=>B(esc(e.ex))+' '+(e.bw?e.reps+' reps':e.w+'kg × '+e.reps)).join(', ')+'.');
  const stalls=[...new Set(S.dayInfo.flatMap(d=>d.rows.filter(r=>LIFT.includes(r.group)).map(r=>r.exercise)))].filter(plateaued);
  if(stalls.length){add(miss,'train',4,`${B(esc(stalls[0]))} has stalled for 3 weeks${stalls.length>1?' (plus '+plural(stalls.length-1,'other lift')+')':''}.`);
    add(next,'train',4,`${B(esc(stalls[0]))}: add 2.5kg to your top set, or one extra set at the same weight, next session.`);}
  // Balance
  if(S.totalSets>0){
    const rows=LIFT.map(g=>({g,s:S.sets[g],t:WEEKLY_SETS[g]*S.f,full:WEEKLY_SETS[g]}));
    const under=rows.filter(x=>x.s<x.t*.6).sort((a,b)=>GOAL_W[b.g]*(1-b.s/b.t)-GOAL_W[a.g]*(1-a.s/a.t));
    const over=rows.filter(x=>x.s>x.t*1.5&&x.s>=4).sort((a,b)=>b.s/b.t-a.s/a.t);
    const on=rows.filter(x=>x.s>=x.t*.9&&x.s<=x.t*1.5);
    if(on.length>=3)add(work,'bal',5,`On target for ${B(on.slice(0,4).map(x=>CATL[x.g]).join(', '))}.`);
    under.slice(0,2).forEach((x,i)=>{add(miss,'bal',9-i,`${B(CATL[x.g])}: ${x.s} of ${x.full} weekly sets${cur&&S.elapsed<7?' (pace: '+Math.round(x.t)+')':''}.`);
      const ex=topExercises(x.g,2),gap=Math.max(2,Math.ceil(x.full-x.s));
      add(next,'bal',9-i,`${cur?'This week':'Next week'}, add ${B(gap+' '+CATL[x.g].toLowerCase()+' sets')}${ex.length?': '+ex.map(esc).join(' and '):''}.`);});
    if(over.length){const o=over[0];add(miss,'bal',5,`${B(CATL[o.g])} is at ${o.s} sets vs a ${o.full}-set target.`);
      if(under.length)add(next,'bal',6,`Shift 2 to 3 ${CATL[o.g].toLowerCase()} sets into ${CATL[under[0].g].toLowerCase()} work.`);}
    if(S.push>0&&S.pull>0){const pr=S.push/S.pull;
      if(pr>1.35)add(miss,'bal',8,`Push to pull is ${B(pr.toFixed(1)+' : 1')}. Back and biceps are behind chest and shoulders.`);
      else if(pr<.75)add(miss,'bal',6,`Push to pull is ${B(pr.toFixed(1)+' : 1')}. Chest and shoulders are behind your pulling.`);
      else add(work,'bal',4,`Push and pull are balanced at ${B(pr.toFixed(1)+' : 1')}.`);}
    else if(S.push>4&&!S.pull)add(miss,'bal',8,`${B('No pull sets')} logged yet${cur?' this week':''}.`);
  }
  // Fuel
  const N=S.nut;
  if(N.logged){
    const pAvg=Math.round(N.avg.pro);
    if(N.hits.pro>=Math.ceil(N.logged*.7))add(work,'fuel',7,`Protein on target ${B(N.hits.pro+' of '+N.logged)} logged days.`);
    else{const gap=Math.max(0,TARGETS.training.pro-pAvg);if(gap>8){add(miss,'fuel',8,`Protein averaged ${B(pAvg+'g')} vs your 190g target.`);add(next,'fuel',8,`Add about ${B(gap+'g protein')} a day. One 30g whey scoop is about 22g${gap>30?', so '+Math.ceil(gap/22)+' scoops':''}.`);}}
    if(N.trainCarb.length){const ca=Math.round(avg(N.trainCarb)),lo=TARGETS.training.carb[0];
      if(ca<lo*.95){const gap=lo-ca;add(miss,'fuel',9,`Carbs averaged ${B(ca+'g')} on training days vs ${lo} to ${TARGETS.training.carb[1]}g.`);
        add(next,'fuel',9,`Add ${B(gap+'g carbs')} on training days. That's about ${Math.round(gap/.28/10)*10}g of cooked white rice.`);}
      else add(work,'fuel',5,`Training-day carbs averaged ${B(ca+'g')}, inside your target.`);}
    const dc=Math.round(avg(N.calDelta));
    if(dc<-250){add(miss,'fuel',8,`Calories ran ${B(fmt(-dc)+' kcal a day')} under target.`);add(next,'fuel',7,`Close the ${fmt(-dc)} kcal gap with one extra meal or snack, mostly carbs.`);}
    else if(dc>350)add(miss,'fuel',5,`Calories ran ${B(fmt(dc)+' kcal a day')} over target.`);
    else if(Math.abs(dc)<=200)add(work,'fuel',6,`Calories landed close to target (${dc>=0?'+':''}${fmt(dc)} kcal a day on average).`);
    const su=Math.round(N.avg.sug);if(su>TARGETS.training.sug){add(miss,'fuel',6,`Sugar averaged ${B(su+'g')} vs a 70g cap.`);add(next,'fuel',5,`Trim about ${B((su-70)+'g sugar')} a day to get back under 70g.`);}
    const fa=Math.round(N.avg.fat);if(fa<56||fa>84)add(miss,'fuel',3,`Fat averaged ${B(fa+'g')} vs a 70g target.`);
  }
  if(N.scored>=2&&N.logged<N.scored*.7){add(miss,'fuel',7,`Meals logged on ${B(N.logged+' of '+N.scored)} days, so fuel insights are partial.`);add(next,'fuel',3,`Log at least your protein and carbs daily, even roughly.`);}
  // Recovery
  if(!cur&&S.restDays>=REST_TARGET)add(work,'rec',4,`${B(plural(S.restDays,'rest day'))} gave muscles time to rebuild.`);
  if(S.maxRun>=6){add(miss,'rec',7,`${B(S.maxRun+' active days in a row')} without a rest day.`);add(next,'rec',7,`Take a full rest day or a recovery session (sauna, stretching) next.`);}
  else if(!cur&&S.restDays<REST_TARGET&&S.activeDays>=6)add(miss,'rec',5,`Only ${B(plural(S.restDays,'rest day'))} this week.`);
  if(S.recMin>=RECOVERY_TARGET)add(work,'rec',4,`${B(S.recMin+' min')} of recovery and mobility work.`);
  else if(S.elapsed>=5&&S.recMin<30){add(miss,'rec',3,`${B(S.recMin?S.recMin+' min':'No')} recovery or mobility logged.`);add(next,'rec',2,`Book two 30-minute recovery blocks (sauna, stretching or yoga).`);}
  if(S.pickMin>0)add(work,'rec',3,`${B(S.pickMin+' min')} of pickleball, counted as active time.`);
  const sort=a=>a.sort((x,y)=>y.pri-x.pri).slice(0,3);
  return{work:sort(work),miss:sort(miss),next:sort(next)};
}

/* =====================================================================
   SVG helpers (rings, sparklines, body map)

function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos((a-90)*Math.PI/180),cy+r*Math.sin((a-90)*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return`M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;}

function setSummary(rows){

  if(same&&s.length>1)return`${s.length} × ${num(s[0].reps)}${num(s[0].weight)>0?' @ '+num(s[0].weight)+'kg':' reps'}`;
  return s.map(one).join(' · ')+(s.some(r=>num(r.weight)>0)?' kg':' reps');

    z.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);s.sh.style.transform=`translateY(${dy}px)`;},{passive:true});
    z.addEventListener('touchend',()=>{if(y0==null)return;s.sh.style.transition='';if(dy>90)closeSheet(s);else s.sh.style.transform='';y0=null;});});}

function wfSug(){const el=$('wf-sug'),inp=$('wf-ex');if(!el||!inp||document.activeElement!==inp){if(el)el.innerHTML='';return;}

function lookupFood(name){if(!name)return null;const u=getUF();if(u[name])return u[name];if(FOOD_DB[name])return FOOD_DB[name];

function deliver(blob,name){
  try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(e=>{if(e&&e.name!=='AbortError')dl(blob,name);});return;}}catch(e){}
  dl(blob,name);}
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}

function mergeData(ws,ns,extra){const ei=new Set(W.map(w=>w.id)),en=new Set(NN.map(n=>n.id));let aw=0,an=0;
  (ws||[]).forEach(w=>{if(!w||!w.date)return;w=normW(w);if(!ei.has(w.id)){W.push(w);ei.add(w.id);aw++;}});
  (ns||[]).forEach(n=>{if(!n||!n.date)return;n=normN(n);if(!en.has(n.id)){NN.push(n);en.add(n.id);an++;}});
  W.sort((a,b)=>b.date.localeCompare(a.date));NN.sort((a,b)=>b.date.localeCompare(a.date));
  if(extra){if(Array.isArray(extra.exercises))extra.exercises.forEach(regEx);if(Array.isArray(extra.food_registry))extra.food_registry.forEach(regFood);if(extra.user_foods&&typeof extra.user_foods==='object'){const u=getUF();Object.keys(extra.user_foods).forEach(k=>{if(!u[k])u[k]=extra.user_foods[k];});lsSet(UFDK,u);FOODS=null;}}
  const ok=saveW()&&saveN();return{aw,an,ok};}
function openRestore(){const s=openSheet({title:'Restore from backup',body:`<div class="banner">Pick an <b>ironlog_backup_*.json</b> file. Entries are merged by ID, so nothing you have now is replaced or deleted.</div><input type="file" accept=".json,application/json" class="in" id="rs-file"><div class="note" id="rs-msg"></div><div style="height:10px"></div><button class="btn" id="rs-go" hidden data-act="rs-go">Restore</button>`});

function exportCSV(){if(!W.length&&!NN.length)return toast('No data to export yet',1);

  const hdr=['Type','Date','Exercise / Meal','Category / Meal Type','Set Number','Reps','Weight (kg)','Duration (hrs)','Duration (mins)','Total Duration (mins)','Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)','Sugar (g)','Heart Rate (bpm)','Foods','Notes','Logged At (UTC)'];
  const rows=[];

function parseCSV(text){const out=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i];
